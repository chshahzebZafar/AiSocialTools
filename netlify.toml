# ############################################################################
# INACTIVE — THIS FILE HAS NO EFFECT ON THE LIVE SITE.
#
# aisocialtools.co is served by Vercel, not Netlify (live responses carry
# "Server: Vercel"). Every header the site actually sends comes from the
# headers() block in next.config.ts.
#
# Proof: this file declares Referrer-Policy = "origin-when-cross-origin",
# but the live site sends "strict-origin-when-cross-origin" — the value in
# next.config.ts. The Cache-Control rule for "/*.html" never matches either,
# since App Router routes are not served with .html extensions.
#
# Edit next.config.ts to change headers. Kept only for a possible Netlify
# migration; delete it if that is not planned.
# ############################################################################

[build]
  command = "npm run build"
  publish = ".next"

# CRITICAL: Redirect old Netlify domain to new custom domain (301 for SEO juice)
[[redirects]]
  from = "https://socialmediatools.netlify.app/*"
  to = "https://aisocialtools.co/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://socialmediatools.netlify.app/*"
  to = "https://aisocialtools.co/:splat"
  status = 301
  force = true

# Redirect www to non-www (canonical)
[[redirects]]
  from = "https://www.aisocialtools.co/*"
  to = "https://aisocialtools.co/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.aisocialtools.co/*"
  to = "https://aisocialtools.co/:splat"
  status = 301
  force = true

# Redirects for URL canonicalization
[[redirects]]
  from = "/*"
  to = "/:splat"
  status = 200
  force = false

# Trailing-slash redirect removed — handled by next.config.ts redirects()
# to avoid a double-redirect chain (netlify → next → destination).

# Ensure HTTPS (Netlify handles this automatically, but explicit is better)
[[redirects]]
  from = "http://aisocialtools.co/*"
  to = "https://aisocialtools.co/:splat"
  status = 301
  force = true

# Headers for SEO
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# Cache static assets
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Don't cache HTML
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

