openapi: 3.0.1
info:
  title: Social Media Tools API
  description: Free AI-powered tools for generating captions, hashtags, bios, content ideas, and tweets for social media platforms.
  version: "1.0.0"
  contact:
    email: shahzaibzafar093@gmail.com
  license:
    name: MIT

servers:
  - url: https://socialmediatools.netlify.app
    description: Production server

paths:
  /tools/hashtag-generator:
    get:
      summary: Generate hashtags for social media
      description: Generate relevant and trending hashtags for Instagram, Twitter, TikTok, and LinkedIn based on keywords.
      parameters:
        - in: query
          name: keyword
          required: true
          schema:
            type: string
          description: The keyword or topic to generate hashtags for
          example: "fitness"
        - in: query
          name: platform
          schema:
            type: string
            enum: [instagram, twitter, tiktok, linkedin]
            default: instagram
          description: The social media platform
      responses:
        "200":
          description: Successfully generated hashtags
          content:
            application/json:
              schema:
                type: object
                properties:
                  hashtags:
                    type: array
                    items:
                      type: string
                  platform:
                    type: string
                  keyword:
                    type: string

  /tools/social-bio-generator:
    get:
      summary: Generate social media bios
      description: Generate engaging bios for Instagram, Twitter, LinkedIn, and TikTok profiles.
      parameters:
        - in: query
          name: name
          schema:
            type: string
          description: Name for the bio
        - in: query
          name: profession
          schema:
            type: string
          description: Profession or role
        - in: query
          name: platform
          schema:
            type: string
            enum: [instagram, twitter, linkedin, tiktok]
            default: instagram
          description: The social media platform
      responses:
        "200":
          description: Successfully generated bio
          content:
            application/json:
              schema:
                type: object
                properties:
                  bio:
                    type: string
                  platform:
                    type: string

  /tools/content-ideas:
    get:
      summary: Generate content ideas
      description: Generate creative content ideas for Instagram, Twitter, LinkedIn, and TikTok.
      parameters:
        - in: query
          name: platform
          schema:
            type: string
            enum: [instagram, twitter, linkedin, tiktok]
            default: instagram
          description: The social media platform
      responses:
        "200":
          description: Successfully generated content ideas
          content:
            application/json:
              schema:
                type: object
                properties:
                  ideas:
                    type: array
                    items:
                      type: string
                  platform:
                    type: string

  /tools/tweet-generator:
    get:
      summary: Generate tweets
      description: Generate engaging tweets and Twitter content.
      parameters:
        - in: query
          name: topic
          required: true
          schema:
            type: string
          description: The topic or idea for the tweet
          example: "AI technology"
      responses:
        "200":
          description: Successfully generated tweet
          content:
            application/json:
              schema:
                type: object
                properties:
                  tweet:
                    type: string
                  topic:
                    type: string

